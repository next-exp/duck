name: Backend ldcRPC Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ldcrpc-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull base image from Docker Hub
        run: |
          docker pull nextmgmt/duck-backend-test-base:latest
          docker tag nextmgmt/duck-backend-test-base:latest duck-backend-test-base:latest

      - name: Run ldcRPC tests
        run: task ldcrpc:test:all
