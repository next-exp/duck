name: Frontend Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull base image from Docker Hub
        run: |
          docker pull nextmgmt/duck-backend-test-base:latest
          docker tag nextmgmt/duck-backend-test-base:latest duck-backend-test-base:latest

      - name: Build E2E Docker image
        run: task e2e:build

      - name: Generate E2E compose
        run: task e2e:gen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        working-directory: gui
        run: npm ci

      - name: Build Playwright Docker image
        run: task frontend-docker:build

      - name: Run integration tests with full stack
        run: task frontend-test-e2e:integration:full

      - name: Cleanup integration test containers
        if: always()
        run: task frontend-test-e2e:integration:down
