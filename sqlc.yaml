version: "2"
sql:
  - engine: "mysql"
    queries: "database/queries"
    schema: "database/schema.sql"
    gen:
      go:
        package: "database"
        out: "pkg/database"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true