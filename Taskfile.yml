  gdcrpc:test:coverage:
    desc: Run gdcRPC tests with coverage report in Docker
    deps: [e2e:check-base]
    cmds:
      - echo 'Running gdcRPC tests with coverage in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && go test -coverprofile=gdcrpc_coverage.out ./gdcRPC/ && go tool cover -func=gdcrpc_coverage.out | grep total"

