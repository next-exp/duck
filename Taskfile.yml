    desc: Run TypeScript type checking for frontend in Docker
    dir: gui
    cmds:
      - echo 'Running TypeScript type checking in Docker...'
      - |
        docker run --rm -v $(pwd):/app -w /app mcr.microsoft.com/playwright:v1.48.2-jammy bash -c "npm ci --include=dev --quiet && npm run type-check"

  frontend-build:
    desc: Build frontend for production
    dir: gui
