  # gdcRPC Development Workflow Targets

  gdcrpc:check:
    desc: Quick compilation check for gdcRPC in Docker - FASTEST feedback
    deps: [e2e:check-base]
    cmds:
      - echo 'Checking gdcRPC compilation in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && go build -o /dev/null ./gdcRPC/"
      - echo '✓ gdcRPC compiles successfully'

  gdcrpc:shell:
    desc: Start interactive development shell for gdcRPC with HDF5 support
