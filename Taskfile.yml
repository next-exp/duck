version: '3'

vars:
  DOCKER_BASE_IMAGE: duck-backend-test-base
  DOCKER_HUB_IMAGE: nextmgmt/duck-backend-test-base

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests in Docker (unit + integration)
    cmds:
      - echo 'Running all tests in Docker...'
      - task test-unit
      - task test-integration:all

  test-unit:
    desc: Run unit tests only (fast) in Docker
    deps: [e2e:check-base]
    cmds:
      - echo 'Running unit tests in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && go test -v -short \$(go list ./... | grep -v integration_tests)"

  test-coverage:
    desc: Run tests with coverage report in Docker
    deps: [e2e:check-base]
    cmds:
      - echo 'Running tests with coverage in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | grep total"
      - echo 'Generate HTML coverage report with task test-coverage-html'

  test-coverage-html:
    desc: Generate HTML coverage report in Docker
    deps: [e2e:check-base]
    cmds:
      - echo 'Generating HTML coverage report in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html"
      - "echo 'Coverage report generated: coverage.html'"

  clean-coverage:
    desc: Clean test cache and coverage files
    cmds:
      - echo 'Cleaning test cache and coverage files...'
      - rm -f coverage.out coverage.html

  clean-containers:
    desc: Remove all integration test containers (MySQL, Centrifuge, etc.)
    cmds:
      - echo 'Removing all integration test containers...'
      - docker ps -a | grep -E "(mysql|centrifugo|duck-integration)" | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || echo 'No test containers found'
      - echo 'Test containers cleaned up'

  test-integration:all:
    desc: Run integration tests in Docker sequentially to avoid port conflicts
    deps: [e2e:check-base]
    cmds:
      - echo "Running integration tests in Docker with host networking..."
      - docker run --rm --network host --privileged -v $(pwd):/src -v /var/run/docker.sock:/var/run/docker.sock -v gocache:/root/.cache/go-build -v gopath:/go -e CGO_ENABLED=1 -e GOPATH=/root/go -e LD_LIBRARY_PATH=/usr/local/hdf5-blosc/lib:/usr/local/hdf5/lib -e CGO_LDFLAGS="-L/usr/local/hdf5/lib -L/usr/local/hdf5-blosc/lib" -e CGO_CFLAGS="-I/usr/local/hdf5/include -I/usr/local/hdf5-blosc/include" --name duck-integration-test-$RANDOM duck-backend-test bash -c "sysctl -w net.ipv4.ping_group_range='0 2147483647' && cd /src && go test -v -tags=integration -timeout=30m -p=1 ./integration_tests/..."

  test-integration:centrifuge:
    desc: Run centrifuge integration tests in Docker
    deps: [e2e:check-base]
    cmds:
      - echo "Running centrifuge integration tests in Docker..."
      - docker run --rm --network host --privileged -v $(pwd):/src -v /var/run/docker.sock:/var/run/docker.sock -v gocache:/root/.cache/go-build -v gopath:/go -e CGO_ENABLED=1 -e GOPATH=/root/go -e LD_LIBRARY_PATH=/usr/local/hdf5-blosc/lib:/usr/local/hdf5/lib -e CGO_LDFLAGS="-L/usr/local/hdf5/lib -L/usr/local/hdf5-blosc/lib" -e CGO_CFLAGS="-I/usr/local/hdf5/include -I/usr/local/hdf5-blosc/include" --name duck-integration-test-$RANDOM duck-backend-test bash -c "sysctl -w net.ipv4.ping_group_range='0 2147483647' && cd /src && go test -v -tags=integration -timeout=30m -p=1 ./integration_tests/centrifuge/..."

  test-integration:database:
    desc: Run database integration tests in Docker
    deps: [e2e:check-base]
    cmds:
      - echo "Running database integration tests in Docker..."
      - docker run --rm --network host --privileged -v $(pwd):/src -v /var/run/docker.sock:/var/run/docker.sock -v gocache:/root/.cache/go-build -v gopath:/go -e CGO_ENABLED=1 -e GOPATH=/root/go -e LD_LIBRARY_PATH=/usr/local/hdf5-blosc/lib:/usr/local/hdf5/lib -e CGO_LDFLAGS="-L/usr/local/hdf5/lib -L/usr/local/hdf5-blosc/lib" -e CGO_CFLAGS="-I/usr/local/hdf5/include -I/usr/local/hdf5-blosc/include" --name duck-integration-test-$RANDOM duck-backend-test bash -c "sysctl -w net.ipv4.ping_group_range='0 2147483647' && cd /src && go test -v -tags=integration -timeout=30m -p=1 ./integration_tests/database/..."

  test-integration:e2e:
    desc: Run e2e integration tests in Docker
    deps: [e2e:check-base]
    cmds:
      - echo "Running e2e integration tests in Docker..."
      - docker run --rm --network host --privileged -v $(pwd):/src -v /var/run/docker.sock:/var/run/docker.sock -v gocache:/root/.cache/go-build -v gopath:/go -e CGO_ENABLED=1 -e GOPATH=/root/go -e LD_LIBRARY_PATH=/usr/local/hdf5-blosc/lib:/usr/local/hdf5/lib -e CGO_LDFLAGS="-L/usr/local/hdf5/lib -L/usr/local/hdf5-blosc/lib" -e CGO_CFLAGS="-I/usr/local/hdf5/include -I/usr/local/hdf5-blosc/include" --name duck-integration-test-$RANDOM duck-backend-test bash -c "sysctl -w net.ipv4.ping_group_range='0 2147483647' && cd /src && go test -v -tags=integration -timeout=30m -p=1 ./integration_tests/e2e/..."

  test-integration:gdc:
    desc: Run gdc integration tests in Docker
    deps: [e2e:check-base]
    cmds:
      - echo "Running gdc integration tests in Docker..."
      - docker run --rm --network host --privileged -v $(pwd):/src -v /var/run/docker.sock:/var/run/docker.sock -v gocache:/root/.cache/go-build -v gopath:/go -e CGO_ENABLED=1 -e GOPATH=/root/go -e LD_LIBRARY_PATH=/usr/local/hdf5-blosc/lib:/usr/local/hdf5/lib -e CGO_LDFLAGS="-L/usr/local/hdf5/lib -L/usr/local/hdf5-blosc/lib" -e CGO_CFLAGS="-I/usr/local/hdf5/include -I/usr/local/hdf5-blosc/include" --name duck-integration-test-$RANDOM duck-backend-test bash -c "sysctl -w net.ipv4.ping_group_range='0 2147483647' && cd /src && go test -v -tags=integration -timeout=30m -p=1 ./integration_tests/gdc/..."

  test-integration:ldc:
    desc: Run ldc integration tests in Docker
    deps: [e2e:check-base]
    cmds:
      - echo "Running ldc integration tests in Docker..."
      - docker run --rm --network host --privileged -v $(pwd):/src -v /var/run/docker.sock:/var/run/docker.sock -v gocache:/root/.cache/go-build -v gopath:/go -e CGO_ENABLED=1 -e GOPATH=/root/go -e LD_LIBRARY_PATH=/usr/local/hdf5-blosc/lib:/usr/local/hdf5/lib -e CGO_LDFLAGS="-L/usr/local/hdf5/lib -L/usr/local/hdf5-blosc/lib" -e CGO_CFLAGS="-I/usr/local/hdf5/include -I/usr/local/hdf5-blosc/include" --name duck-integration-test-$RANDOM duck-backend-test bash -c "sysctl -w net.ipv4.ping_group_range='0 2147483647' && cd /src && go test -v -tags=integration -timeout=30m -p=1 ./integration_tests/ldc/..."


  go-lint:
    desc: Run linter in Docker
    deps: [e2e:check-base]
    cmds:
      - echo 'Running linter in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && if command -v golangci-lint > /dev/null; then golangci-lint run; else echo 'golangci-lint not available in container'; fi"

  # E2E testing targets

  e2e:build-base:
    desc: Build base Docker image with HDF5 and Blosc (one-time setup, ~10 min)
    cmds:
      - echo 'Building base Docker image with HDF5 and Blosc...'
      - echo 'This will take ~10 minutes. You only need to do this once.'
      - docker compose --profile base -f docker/testing/docker-compose.yml build --no-cache backend-test-base
      - "echo 'Base image built successfully: duck-backend-test-base:latest'"

  e2e:push-base:
    desc: Push base Docker image to Docker Hub
    cmds:
      - echo 'Pushing base Docker image to Docker Hub...'
      - docker tag {{.DOCKER_BASE_IMAGE}}:latest {{.DOCKER_HUB_IMAGE}}:latest
      - docker push {{.DOCKER_HUB_IMAGE}}:latest
      - echo 'Base image pushed to {{.DOCKER_HUB_IMAGE}}:latest'

  e2e:check-base:
    desc: Check if base Docker image exists, build if needed
    cmds:
      - |
        if ! docker images | grep -q duck-backend-test-base; then
          echo "Base image 'duck-backend-test-base' not found. Building it now..."
          echo "This will take ~10 minutes. You only need to do this once."
          docker compose --profile base -f docker/testing/docker-compose.yml build --no-cache backend-test-base
        else
          echo "Base image 'duck-backend-test-base' found."
        fi
    silent: false

  e2e:clean-base:
    desc: Remove base Docker image (will require full rebuild)
    cmds:
      - echo 'Removing base image (HDF5 + Blosc)...'
      - "echo 'You will need to rebuild with: task e2e:build-base (~10 min)'"
      - docker rmi duck-backend-test-base:latest 2>/dev/null || echo 'Base image not found or already removed'

  e2e:build:
    desc: Build E2E Docker image with compiled binaries (requires base image)
    deps: [e2e:check-base]
    cmds:
      - echo 'Building E2E Docker image with compiled binaries...'
      - echo 'This compiles the project once and creates an image shared by all services'
      - docker build -f docker/Dockerfile.build -t duck-e2e:latest .

  e2e:gen:
    desc: Generate E2E compose and seed
    cmds:
      - go run ./docker/e2e/setups/standard/gen-compose.go

  e2e:up:
    desc: Bring up E2E stack (uses docker-compose.gen.yml)
    deps: [e2e:build, e2e:gen]
    cmds:
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/standard/docker-compose.gen.yml \
          --env-file docker/e2e/.env.example \
          up -d --remove-orphans
      - |
        echo ''
        echo 'E2E environment started!'
        echo 'API - http://localhost:1323'
        echo 'Centrifugo - http://localhost:8000'
        echo ''
        echo 'To start GUI dev server - task e2e:up:dev'
        echo 'To view logs - task e2e:logs'
        echo 'To stop - task e2e:down'

  e2e:up:dev:
    desc: Bring up E2E stack WITH GUI dev server (full system with hot reload)
    deps: [e2e:build, e2e:gen]
    cmds:
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/standard/docker-compose.gen.yml \
          --env-file docker/e2e/.env.example \
          --profile dev \
          up -d --remove-orphans
      - |
        echo ''
        echo 'E2E environment with GUI dev server started!'
        echo ''
        echo 'Services available-'
        echo '  - GUI Dev - http://localhost:5173 (with hot reload!)'
        echo '  - API - http://localhost:1323'
        echo '  - Centrifugo - http://localhost:8000'
        echo '  - MySQL - localhost:3306'
        echo ''
        echo 'Full system running - MySQL, Centrifugo, API, GDCs, LDCs, Test Devices, and GUI'
        echo ''
        echo 'Edit files in gui/src/* and see changes instantly!'
        echo ''
        echo 'View logs - task e2e:logs'
        echo 'View GUI logs - task e2e:logs-gui'
        echo 'Recompile Go code - task e2e:recompile'
        echo 'Stop - task e2e:down'

  e2e:down:
    desc: Tear down E2E stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml --profile dev down -v

  e2e:logs:
    desc: View logs from E2E stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml logs -f

  e2e:logs-gui:
    desc: View GUI dev server logs from E2E stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml logs -f gui

  e2e:logs-api:
    desc: View API server logs from E2E stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml logs -f api

  e2e:recompile:
    desc: Recompile Go code and restart Go services (api, gdc, ldc, devices) without resetting MySQL/Centrifugo
    deps: [e2e:build, e2e:gen]
    cmds:
      - |
        echo 'Stopping and removing Go-related containers...'
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/standard/docker-compose.gen.yml \
          --env-file docker/e2e/.env.example \
          stop api $(docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml --env-file docker/e2e/.env.example config --services | grep -E '^(gdc-|ldc-|dev-)')
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/standard/docker-compose.gen.yml \
          --env-file docker/e2e/.env.example \
          rm -f api $(docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml --env-file docker/e2e/.env.example config --services | grep -E '^(gdc-|ldc-|dev-)')
      - |
        echo 'Restarting Go-related containers...'
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/standard/docker-compose.gen.yml \
          --env-file docker/e2e/.env.example \
          up -d api $(docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml --env-file docker/e2e/.env.example config --services | grep -E '^(gdc-|ldc-|dev-)')
      - |
        echo ''
        echo 'Go services recompiled and restarted!'
        echo 'MySQL and Centrifugo were kept running.'
        echo ''

  e2e:restart:
    desc: Restart E2E stack
    cmds:
      - task e2e:down
      - task e2e:up

  e2e:restart:dev:
    desc: Restart E2E stack with GUI dev server
    cmds:
      - task e2e:down
      - task e2e:up:dev

  # NEXT-100 simulation targets (using device simulators with real data)

  e2e:gen:next100:
    desc: Generate NEXT-100 compose and seed (7 LDCs, 7 GDCs, 28 equipments with real data)
    cmds:
      - go run ./docker/e2e/setups/next100/gen-compose-next100.go

  e2e:up:next100:
    desc: Bring up NEXT-100 simulation stack (uses docker-compose.gen-next100.yml)
    deps: [e2e:build, e2e:gen:next100]
    cmds:
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/next100/docker-compose.gen-next100.yml \
          --env-file docker/e2e/.env.example \
          up -d --remove-orphans
      - |
        echo ''
        echo 'NEXT-100 simulation environment started!'
        echo 'This simulates the full NEXT-100 DAQ system with real data replay:'
        echo '  - 7 LDCs (ldc1next - ldc7next)'
        echo '  - 7 GDCs (gdc1next - gdc7next)'
        echo '  - 28 Device Simulators (4 per LDC, replaying real NEXT-100 data)'
        echo ''
        echo 'Services available-'
        echo '  - API - http://localhost:1323'
        echo '  - Centrifugo - http://localhost:8000'
        echo '  - MySQL - localhost:3306'
        echo ''
        echo 'To start GUI dev server - task e2e:up:next100:dev'
        echo 'To view logs - task e2e:logs:next100'
        echo 'To stop - task e2e:down:next100'

  e2e:up:next100:dev:
    desc: Bring up NEXT-100 simulation WITH GUI dev server (full system with hot reload)
    deps: [e2e:build, e2e:gen:next100]
    cmds:
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/next100/docker-compose.gen-next100.yml \
          --env-file docker/e2e/.env.example \
          --profile dev \
          up -d --remove-orphans
      - |
        echo ''
        echo 'NEXT-100 simulation environment with GUI dev server started!'
        echo ''
        echo 'This simulates the full NEXT-100 DAQ system with real data replay:'
        echo '  - 7 LDCs (ldc1next - ldc7next)'
        echo '  - 7 GDCs (gdc1next - gdc7next)'
        echo '  - 28 Device Simulators (4 per LDC, replaying real NEXT-100 data)'
        echo ''
        echo 'Services available-'
        echo '  - GUI Dev - http://localhost:5173 (with hot reload!)'
        echo '  - API - http://localhost:1323'
        echo '  - Centrifugo - http://localhost:8000'
        echo '  - MySQL - localhost:3306'
        echo ''
        echo 'Full NEXT-100 system running - MySQL, Centrifugo, API, GDCs, LDCs, Device Simulators, and GUI'
        echo ''
        echo 'Edit files in gui/src/* and see changes instantly!'
        echo ''
        echo 'View logs - task e2e:logs:next100'
        echo 'View GUI logs - task e2e:logs-gui'
        echo 'Recompile Go code - task e2e:recompile:next100'
        echo 'Stop - task e2e:down:next100'

  e2e:down:next100:
    desc: Tear down NEXT-100 simulation stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/next100/docker-compose.gen-next100.yml --profile dev down -v

  e2e:logs:next100:
    desc: View logs from NEXT-100 simulation stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/next100/docker-compose.gen-next100.yml logs -f

  e2e:recompile:next100:
    desc: Recompile Go code and restart Go services for NEXT-100 simulation without resetting MySQL/Centrifugo
    deps: [e2e:build, e2e:gen:next100]
    cmds:
      - |
        echo 'Stopping and removing Go-related containers...'
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/next100/docker-compose.gen-next100.yml \
          --env-file docker/e2e/.env.example \
          stop api $(docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/next100/docker-compose.gen-next100.yml --env-file docker/e2e/.env.example config --services | grep -E '^(gdc|ldc|sim-)')
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/next100/docker-compose.gen-next100.yml \
          --env-file docker/e2e/.env.example \
          rm -f api $(docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/next100/docker-compose.gen-next100.yml --env-file docker/e2e/.env.example config --services | grep -E '^(gdc|ldc|sim-)')
      - |
        echo 'Restarting Go-related containers...'
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/next100/docker-compose.gen-next100.yml \
          --env-file docker/e2e/.env.example \
          up -d api $(docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/next100/docker-compose.gen-next100.yml --env-file docker/e2e/.env.example config --services | grep -E '^(gdc|ldc|sim-)')
      - |
        echo ''
        echo 'Go services recompiled and restarted for NEXT-100 simulation!'
        echo 'MySQL and Centrifugo were kept running.'
        echo ''

  e2e:restart:next100:
    desc: Restart NEXT-100 simulation stack
    cmds:
      - task e2e:down:next100
      - task e2e:up:next100

  e2e:restart:next100:dev:
    desc: Restart NEXT-100 simulation stack with GUI dev server
    cmds:
      - task e2e:down:next100
      - task e2e:up:next100:dev

  # Caddy deployment targets

  deploy:build:
    desc: Build frontend Docker image for Caddy deployment
    cmds:
      - echo 'Building frontend Docker image for Caddy...'
      - docker build -f gui/Dockerfile.caddy -t duck-frontend:latest gui/

  deploy:up:
    desc: Bring up E2E stack with Caddy serving the frontend (production-like)
    deps: [e2e:build, e2e:gen, deploy:build]
    cmds:
      - |
        docker compose \
          -f docker/e2e/docker-compose.yml \
          -f docker/e2e/setups/standard/docker-compose.gen.yml \
          -f docker/e2e/docker-compose.caddy.yml \
          --env-file docker/e2e/.env.example \
          up -d --remove-orphans
      - |
        echo ''
        echo 'E2E environment with Caddy started!'
        echo ''
        echo 'Services available-'
        echo '  - GUI - http://localhost:80/daq/ (via Caddy)'
        echo '  - API - http://localhost:1323'
        echo '  - Centrifugo - http://localhost:8000'
        echo '  - MySQL - localhost:3306'
        echo ''
        echo 'View logs - task deploy:logs'
        echo 'View Caddy logs - task deploy:logs-caddy'
        echo 'Stop - task deploy:down'

  deploy:down:
    desc: Tear down Caddy stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml -f docker/e2e/docker-compose.caddy.yml --env-file docker/e2e/.env.example down -v

  deploy:logs:
    desc: View logs from Caddy stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/setups/standard/docker-compose.gen.yml -f docker/e2e/docker-compose.caddy.yml logs -f

  deploy:logs-caddy:
    desc: View Caddy logs from Caddy stack
    cmds:
      - docker compose -f docker/e2e/docker-compose.yml -f docker/e2e/docker-compose.caddy.yml logs -f caddy

  # Frontend testing targets

  frontend-docker:build:
    desc: Build Playwright Docker image for e2e tests
    dir: gui
    cmds:
      - echo 'Building Playwright Docker image...'
      - npm run docker:build

  frontend-test:
    desc: Run all frontend tests (unit locally + e2e in Docker)
    dir: gui
    cmds:
      - echo 'Running frontend unit tests...'
      - npm run test:unit -- --run
      - echo 'Running frontend e2e tests in Docker...'
      - npm run docker:test

  frontend-test-unit:
    desc: Run frontend unit tests (watch mode)
    dir: gui
    cmds:
      - echo 'Running frontend unit tests...'
      - npm run test:unit

  frontend-test-unit-run:
    desc: Run frontend unit tests once (CI mode)
    dir: gui
    cmds:
      - echo 'Running frontend unit tests once...'
      - npm run test:unit -- --run

  frontend-test-coverage:
    desc: Run frontend tests with coverage report (requires @vitest/coverage-v8)
    dir: gui
    cmds:
      - echo 'Running frontend tests with coverage...'
      - |
        if npm list @vitest/coverage-v8 >/dev/null 2>&1; then
          npm run test:coverage -- --run
        else
          echo "Coverage dependency not installed. Install with:"
          echo "  cd gui && npm install --save-dev @vitest/coverage-v8"
          exit 1
        fi

  frontend-test-e2e:
    desc: Run frontend e2e tests in Docker
    dir: gui
    cmds:
      - echo 'Running frontend e2e tests in Docker...'
      - npm run docker:test

  frontend-test-e2e:chromium:
    desc: Run frontend e2e tests in Docker (Chromium only)
    dir: gui
    cmds:
      - echo 'Running frontend e2e tests in Docker (Chromium)...'
      - npm run docker:test:chromium

  frontend-test-e2e:firefox:
    desc: Run frontend e2e tests in Docker (Firefox only)
    dir: gui
    cmds:
      - echo 'Running frontend e2e tests in Docker (Firefox)...'
      - npm run docker:test:firefox

  frontend-test-e2e:webkit:
    desc: Run frontend e2e tests in Docker (WebKit only)
    dir: gui
    cmds:
      - echo 'Running frontend e2e tests in Docker (WebKit)...'
