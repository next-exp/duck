  frontend-dev:
    desc: Start frontend development server
    dir: gui
    cmds:
      - echo 'Starting frontend development server...'
      - npm run dev

  # Code generation targets

  gen:rpc:
    desc: Generate ConnectRPC stubs for internal services (control)
    cmds:
      - echo 'Generating ConnectRPC stubs for internal services...'
      - cd rpc/proto/control && buf generate

  gen:api:
    desc: Generate ConnectRPC stubs for Web API (api + TypeScript)
    cmds:
      - echo 'Generating ConnectRPC stubs for Web API...'
      - cd gui && npm install --silent
      - cd rpc/proto/api && PATH="{{.ROOT_DIR}}/gui/node_modules/.bin:$PATH" buf generate

  gen:setup:
    desc: Install all protoc plugins needed for code generation
    cmds:
      - echo 'Installing Go protoc plugins...'
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
      - echo 'Installing npm dependencies...'
      - cd gui && npm install
      - echo 'Setup complete!'

  gen:mocks:
    desc: Generate mock implementations using mockery
    cmds:
      - echo 'Generating mock implementations...'
      - mockery --dir=pkg/database --name=Querier --output=pkg/database/mocks --outpkg=mocks
      - echo 'Mocks generated in pkg/database/mocks/'

  gen:all:
    desc: Generate all code (ConnectRPC stubs + mocks)
    deps: [gen:rpc, gen:api, gen:mocks]
    cmds:
      - echo 'All code generation completed!'

