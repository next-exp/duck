      - echo 'Available commands inside shell:'
      - "echo '  cd gdcRPC && go test -v              # Run tests'"
      - "echo '  cd gdcRPC && go build -v             # Check compilation'"
      - "echo '  cd gdcRPC && go test -race -v        # Race detector'"
      - "echo '  cd gdcRPC && go test -cover          # Coverage'"
      - echo ''
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash

  gdcrpc:test:unit:
    desc: Run gdcRPC tests in Docker with HDF5 environment
    deps: [e2e:check-base]
    cmds:
      - echo 'Running gdcRPC tests in Docker...'
      - docker compose --profile test -f docker/testing/docker-compose.yml run --rm backend-test bash -c "cd /src && go test -v -timeout=10m ./gdcRPC/"

  gdcrpc:test:race:
    desc: Run gdcRPC tests with race detector in Docker
    deps: [e2e:check-base]
    cmds:
      - echo 'Running gdcRPC tests with race detector in Docker...'
