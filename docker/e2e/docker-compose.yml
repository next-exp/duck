name: duck-e2e

networks:
  daq_ctrl:
    driver: bridge

volumes:
  mysql_data:
  gui_node_modules:

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dummy_root_password
      MYSQL_DATABASE: duck
      MYSQL_USER: duck
      MYSQL_PASSWORD: dummy_password
    healthcheck:
      test: ["CMD", "mysql", "-u", "duck", "-pdummy_password", "-e", "SELECT 1 FROM gdcs LIMIT 1;", "duck"]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 40s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - daq_ctrl

  centrifugo:
    image: centrifugo/centrifugo:v5.2.0
    command: centrifugo --config /etc/centrifugo/centrifugo.json
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    volumes:
      - ./centrifugo.json:/etc/centrifugo/centrifugo.json
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 50
    networks:
      - daq_ctrl

  api:
    image: duck-e2e:latest
    working_dir: /app
    command: ["/app/bin/duckAPI", "-config", "/app/docker/e2e/configuration.yml"]
    depends_on:
      mysql:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    ports:
      - "${API_PORT:-1323}:1323"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1323/health"]
      interval: 5s
      timeout: 3s
      retries: 50
    networks:
      - daq_ctrl

  # GUI Development Server (Vue 3 + Vite with hot reload)
  # Optional service for development - access the full system via web UI
  gui:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      # Mount the entire gui directory for hot reload
      - ../../gui:/app
      # Use named volume for node_modules to avoid platform issues
      - gui_node_modules:/app/node_modules
    ports:
      - "${GUI_PORT:-5173}:5173"
    environment:
      # Vite environment variables
      - VITE_API_SERVER=http://localhost:${API_PORT:-1323}/daq
      - VITE_WS_SERVER=ws://localhost:${CENTRIFUGO_PORT:-8000}
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 100
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - daq_ctrl
    profiles:
      - dev
    stdin_open: true
    tty: true

  # gdc-*, ldc-*, dev-* services and data_ldc_* networks will be defined in docker-compose.gen.yml
